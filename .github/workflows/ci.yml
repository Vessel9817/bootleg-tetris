name: CI

on:
  push:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
        python-version: ['3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install --group publish .
  mypy:
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.13']
        os: ['ubuntu-latest', 'windows-latest']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install --group publish --group typing .
      - name: Run mypy
        run: ${{ startsWith(matrix.os, 'windows') && 'python' || 'python3' }} -m mypy './src/'
